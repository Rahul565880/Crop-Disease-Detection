services:
  - type: web
    name: crop-disease-detection
    env: node
    repo: https://github.com/Rahul565880/Crop-Disease-Detection
    branch: master
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    rootDir: server
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_SERVICE_URL
        value: https://crop-disease-detection-ml.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: crop-disease-detection-ml
    env: python
    repo: https://github.com/Rahul565880/Crop-Disease-Detection
    branch: master
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    rootDir: ml-service
    healthCheckPath: /health
