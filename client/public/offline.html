<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Crop Disease Detection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
      text-align: center;
      padding: 20px;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 10px; color: #16a34a; }
    p { font-size: 16px; color: #64748b; max-width: 400px; line-height: 1.5; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    @media(prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      p { color: #94a3b8; }
    }
  </style>
</head>
<body>
  <div class="icon">🌱</div>
  <h1>You're Offline</h1>
  <p>Connect to the internet to use Crop Disease Detection. Your saved disease guide is still available.</p>
  <a class="btn" href="/diseases">View Disease Guide</a>
  <p style="margin-top:20px"><a href="/" style="color:#16a34a">Try Again</a></p>
  <script>
    document.querySelector('a[href="/"]').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.reload();
    });
  </script>
</body>
</html>
